<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Worksheet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chords">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E4E7EB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1E2433;
  --muted: #5B6474;
  --line: #C9CED6;
  --desk: #E4E7EB;
  --surface: #FFFFFF;
  --felt: #7D1D2C;
  --felt-soft: #F3E4E6;
  --warn: #8A5A00;
  --warn-soft: #FFF3D6;
  --ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8EAF0; --muted: #A3AAB8; --line: #3A4150; --desk: #171A21;
    --surface: #222733; --felt: #D0707F; --felt-soft: #3A2328; --warn: #F2C166; --warn-soft: #3A3120;
  }
}
:root[data-theme="dark"] {
  --ink: #E8EAF0; --muted: #A3AAB8; --line: #3A4150; --desk: #171A21;
  --surface: #222733; --felt: #D0707F; --felt-soft: #3A2328; --warn: #F2C166; --warn-soft: #3A3120;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--felt); outline-offset: 2px; }

/* ---------- App chrome ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--desk); border-bottom: 1px solid var(--line);
}
.bar h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; flex: 1; min-width: 0; }
.bar .title-btn { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 2px; font-family: var(--display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
.btn.primary { background: var(--felt); border-color: var(--felt); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1b0d10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1b0d10; } }
.btn.on { background: var(--felt-soft); border-color: var(--felt); }
.btn.quiet { background: transparent; border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--felt); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; min-height: 38px; min-width: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--felt); color: #fff; }
main { padding: 16px 14px 80px; max-width: 900px; margin: 0 auto; }

/* ---------- Home ---------- */
.home-intro { color: var(--muted); margin: 4px 0 18px; max-width: 60ch; }
.section-title { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 26px 0 10px; }
.starters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.starter { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.starter strong { display: block; margin-bottom: 2px; }
.starter span { color: var(--muted); font-size: 14px; }
.mini-layout { display: grid; gap: 3px; margin-bottom: 10px; background: #fff; border: 1px solid var(--line); padding: 6px; border-radius: 4px; aspect-ratio: 8.5/7; align-content: start; }
.mini-row { display: grid; gap: 3px; }
.mini-cell { height: 12px; background: repeating-linear-gradient(90deg, #fff 0 5px, #9aa1ad 5px 6px); border: 1px solid #9aa1ad; }
.sheet-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sheet-list li { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.sheet-list li:last-child { border-bottom: 0; }
.sheet-open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 12px 14px; }
.sheet-open strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-open span { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); padding: 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.backup-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Paper ---------- */
.pages { display: flex; flex-direction: column; gap: 22px; align-items: center; }
.page-wrap { width: 100%; max-width: 816px; }
.page-head { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.page-head .spacer { flex: 1; }
.paper-frame { position: relative; width: 100%; overflow: hidden; }
.paper {
  width: 816px; height: 1056px; padding: 48px; background: #fff; color: #1E2433;
  transform-origin: top left; box-shadow: 0 1px 2px rgba(20,24,33,.18), 0 6px 18px rgba(20,24,33,.10);
  display: flex; flex-direction: column; font-family: var(--ui);
}
.paper-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 10px; border-bottom: 2px solid #1E2433; margin-bottom: 18px; }
.paper-title { font-family: var(--display); font-size: 30px; line-height: 1; margin: 0; }
.name-line { display: flex; gap: 18px; font-size: 13px; color: #1E2433; }
.name-line span { display: inline-block; border-bottom: 1px solid #1E2433; min-width: 150px; padding-top: 14px; }
.name-line span.date { min-width: 90px; }
.rows { flex: 1; display: grid; gap: 10px; }
.row { display: grid; column-gap: 29px; align-items: center; position: relative; }
.cell { position: relative; min-width: 0; border-radius: 6px; }
.cell-name { display: block; border-bottom: 1px solid #7A8190; max-width: 240px; height: 30px; font-size: 19px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
.cell svg { display: block; width: 100%; height: auto; max-height: var(--kh, 999px); }
.paper.editable .cell { cursor: pointer; }
.paper.editable .cell:hover { outline: 2px solid var(--felt-soft); outline-offset: 5px; }
.cell.active { outline: 3px solid #7D1D2C !important; outline-offset: 5px; }
.flag { position: absolute; top: 2px; right: 0; font-size: 12px; background: #FFF3D6; color: #8A5A00; border: 1px solid #E8C877; border-radius: 10px; padding: 1px 8px; }
.row-tools { position: absolute; left: -48px; right: -48px; top: -6px; bottom: -6px; border: 2px dashed #9AA1AD; border-radius: 8px; pointer-events: none; }
.layout-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 20px; }
.paper .layout-bar .seg button { min-width: 64px; min-height: 52px; font-size: 22px; }
.paper .layout-bar .btn { min-height: 52px; font-size: 20px; }
.layout-row-controls { position: absolute; z-index: 3; top: 50%; right: 0; transform: translateY(-50%); background: #fff; border: 1px solid #9AA1AD; border-radius: 10px; padding: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.add-row { margin-top: 8px; }
.add-row .btn { font-size: 22px; min-height: 56px; width: 100%; border-style: dashed; background: #fff; color: #1E2433; }

.after-pages { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

/* ---------- Editor sheet ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15,18,25,.35); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.panel {
  background: var(--surface); width: 100%; max-width: 900px; border-radius: 16px 16px 0 0;
  padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); max-height: 92%; overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,.2);
}
.panel.center { border-radius: 14px; margin: auto 12px; max-width: 460px; padding-bottom: 16px; }
.overlay.middle { align-items: center; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0 0 10px; }
.panel p { margin: 0 0 12px; color: var(--muted); }
.panel-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.panel-top .grow { flex: 1; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label, .lbl { font-size: 14px; color: var(--muted); }
.text-in { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); min-height: 44px; width: 100%; font-size: 18px; }
.controls { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.controls > div { display: flex; flex-direction: column; gap: 4px; }
.swatch-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.3); }
.kbd-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 0 10px 10px; }
.kbd-scroll .felt { height: 5px; background: #7D1D2C; margin: 0 -10px 0; }
.kbd-scroll svg { display: block; height: auto; }
.kbd-scroll svg [data-midi] { cursor: pointer; }
.shift-row { display: flex; align-items: center; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
.shift-row .range { flex: 1; text-align: center; color: var(--muted); font-size: 14px; min-width: 120px; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.editor-actions .grow { flex: 1; }
.dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
.dialog-buttons.stack { flex-direction: column; align-items: stretch; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--felt); }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 6px 0 10px; }

/* Style editor */
.hand-style { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.hand-style h3 { margin: 0 0 8px; font-size: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.swatches button[aria-pressed="true"] { border-color: var(--ink); }
.swatches input[type="color"] { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); }
.style-preview { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--desk); padding: 10px 16px; border-radius: 10px; z-index: 80; max-width: 90%; font-size: 15px; }

@media (prefers-reduced-motion: no-preference) {
  .overlay.enter .panel { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- Print ---------- */
.print-only { display: none; }
@page { size: letter; margin: 0.5in; }
@media print {
  html, body { background: #fff !important; }
  :root { padding: 0 !important; }
  .bar, .page-head, .after-pages, .overlay, .toast, .flag, .layout-row-controls, .add-row, .row-tools, .no-print, .home { display: none !important; }
  main { padding: 0 !important; max-width: none !important; margin: 0 !important; }
  .pages { display: block !important; }
  .page-wrap { max-width: none !important; width: auto !important; }
  .paper-frame { height: auto !important; overflow: visible !important; }
  .paper { transform: none !important; box-shadow: none !important; width: 7.5in !important; height: 9.85in !important; padding: 0 !important; break-after: page; page-break-after: always; }
  .page-wrap:last-child .paper { break-after: auto; page-break-after: auto; }
  .cell, .cell.active, .paper.editable .cell:hover { outline: none !important; }
  body.hide-names .cell-name-text { visibility: hidden; }
  body.hide-marks .mark { display: none; }
  body.no-nameline .name-line { visibility: hidden; }
}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(() => {
'use strict';

/* ================= Music helpers ================= */
const LOW = 21, HIGH = 108;                         // A0..C8
const WHITE_PCS = new Set([0, 2, 4, 5, 7, 9, 11]);
const isWhite = m => WHITE_PCS.has(((m % 12) + 12) % 12);
const WHITES = [];
for (let m = LOW; m <= HIGH; m++) if (isWhite(m)) WHITES.push(m);
const WIDX = {}; WHITES.forEach((m, i) => { WIDX[m] = i; });
const KEYS_PER_ROW = { 1: 29, 2: 15, 3: 9 };        // white keys visible per chord, by chords-per-row
const DEFAULT_START = { 1: WIDX[36], 2: WIDX[48], 3: WIDX[60] }; // C2, C3, C4 → middle C centered-ish
const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const noteName = (m, acc) => (acc === 'flat' ? FLAT : SHARP)[m % 12] + (Math.floor(m / 12) - 1);
const notePc = (m, acc) => (acc === 'flat' ? FLAT : SHARP)[m % 12];
const MIDDLE_C = 60;
const MAX_ROWS = 6;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function maxStart(n) { return WHITES.length - n; }

// white-index span a marked key needs to be fully visible
function needSpan(m) {
  if (isWhite(m)) return [WIDX[m], WIDX[m]];
  return [WIDX[m - 1], WIDX[m + 1]];
}
function markedMidis(cell) { return Object.keys(cell.marks).map(Number).sort((a, b) => a - b); }
function outOfView(cell, n) {
  const count = KEYS_PER_ROW[n], s = cell.start, e = s + count - 1;
  return markedMidis(cell).filter(m => { const [a, b] = needSpan(m); return a < s || b > e; }).length;
}
function fitStart(cell, n) {
  const count = KEYS_PER_ROW[n];
  const ms = markedMidis(cell);
  if (!ms.length) { cell.start = DEFAULT_START[n]; return; }
  let lo = Infinity, hi = -Infinity;
  ms.forEach(m => { const [a, b] = needSpan(m); lo = Math.min(lo, a); hi = Math.max(hi, b); });
  let s;
  if (hi - lo + 1 <= count) {
    s = Math.round((lo + hi) / 2 - (count - 1) / 2);
    s = clamp(s, hi - count + 1, lo);
  } else s = lo;
  cell.start = clamp(s, 0, maxStart(count));
}

/* ================= Styles ================= */
const PRESETS = ['#1F3A93', '#7D1D2C', '#2E6B3A', '#4B2C6F', '#222222', '#F2A541', '#8FC3E8', '#F4A3B4', '#B7E07A', '#BDBDBD'];
const DEFAULT_STYLES = {
  L: { type: 'key', color: '#1F3A93', pattern: 'stripes' },
  R: { type: 'key', color: '#F2A541', pattern: 'stripes' }
};
const STYLE_TYPES = [['key', 'Color'], ['pattern', 'Pattern'], ['dot', 'Dot'], ['label', 'Dot + name']];
const PATTERNS = [['stripes', 'Stripes'], ['cross', 'Crosshatch'], ['dots', 'Polka dots']];
function hexToRgb(h) { const x = parseInt(h.slice(1), 16); return [(x >> 16) & 255, (x >> 8) & 255, x & 255]; }
function lum(h) {
  const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function grayRisk(styles) {
  const a = styles.L, b = styles.R;
  if (a.type !== b.type) return false;
  if (a.type === 'pattern' && a.pattern !== b.pattern) return false;
  return Math.abs(lum(a.color) - lum(b.color)) < 0.2;
}
const cloneStyles = s => JSON.parse(JSON.stringify(s));

/* ================= Data ================= */
const STORE_KEY = 'chordWorksheet.v1';
let data = { version: 1, settings: { styles: cloneStyles(DEFAULT_STYLES) }, sheets: [] };
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.sheets)) data = sanitizeData(d); }
  } catch (e) { storageOk = false; }
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); storageOk = true; }
  catch (e) { if (storageOk) toast('This device won’t save right now. Export a backup to keep your work.'); storageOk = false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function newCell(n) { return { name: '', acc: 'sharp', start: DEFAULT_START[n], marks: {} }; }
function newRow(n) { return { n, cells: Array.from({ length: n }, () => newCell(n)) }; }
function newPage(ns) { return { rows: ns.map(newRow) }; }
function cellHasContent(c) { return !!(c.name.trim() || Object.keys(c.marks).length); }

function sanitizeStyle(s, fallback) {
  const out = Object.assign({}, fallback);
  if (s && typeof s === 'object') {
    if (STYLE_TYPES.some(t => t[0] === s.type)) out.type = s.type;
    if (typeof s.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(s.color)) out.color = s.color;
    if (PATTERNS.some(p => p[0] === s.pattern)) out.pattern = s.pattern;
  }
  return out;
}
function sanitizeStyles(s) { s = s || {}; return { L: sanitizeStyle(s.L, DEFAULT_STYLES.L), R: sanitizeStyle(s.R, DEFAULT_STYLES.R) }; }
function sanitizeCell(c, n) {
  const out = newCell(n);
  if (!c || typeof c !== 'object') return out;
  if (typeof c.name === 'string') out.name = c.name.slice(0, 40);
  if (c.acc === 'flat') out.acc = 'flat';
  if (c.marks && typeof c.marks === 'object') {
    for (const k in c.marks) { const m = +k; if (m >= LOW && m <= HIGH && (c.marks[k] === 'L' || c.marks[k] === 'R')) out.marks[m] = c.marks[k]; }
  }
  if (Number.isInteger(c.start)) out.start = clamp(c.start, 0, maxStart(KEYS_PER_ROW[n]));
  return out;
}
function sanitizeSheet(s) {
  const pages = (Array.isArray(s.pages) ? s.pages : []).map(p => {
    const rows = (Array.isArray(p && p.rows) ? p.rows : []).slice(0, MAX_ROWS).map(r => {
      const n = [1, 2, 3].includes(r && r.n) ? r.n : 2;
      const cells = Array.from({ length: n }, (_, i) => sanitizeCell(r.cells && r.cells[i], n));
      return { n, cells };
    });
    return { rows: rows.length ? rows : [newRow(2)] };
  });
  return {
    id: typeof s.id === 'string' ? s.id : uid(),
    name: typeof s.name === 'string' && s.name.trim() ? s.name.slice(0, 80) : 'Untitled sheet',
    updated: Number.isFinite(s.updated) ? s.updated : Date.now(),
    styles: sanitizeStyles(s.styles),
    print: { names: !(s.print && s.print.names === false), marks: !(s.print && s.print.marks === false), nameLine: !(s.print && s.print.nameLine === false) },
    pages: pages.length ? pages : [newPage([2, 2, 2, 2])]
  };
}
function sanitizeData(d) {
  return { version: 1, settings: { styles: sanitizeStyles(d.settings && d.settings.styles) }, sheets: d.sheets.map(sanitizeSheet) };
}

const STARTERS = [
  { name: '8 chords', desc: '4 rows of 2', rows: [2, 2, 2, 2] },
  { name: 'Two hands', desc: '4 rows of 1, wide keyboards', rows: [1, 1, 1, 1] },
  { name: '15 chords', desc: '5 rows of 3', rows: [3, 3, 3, 3, 3] },
  { name: 'Mixed', desc: 'Rows of 3, 2 and 1', rows: [3, 3, 2, 2, 1] }
];

/* ================= View state ================= */
const view = { screen: 'home', sheetId: null, layout: false, editor: null, hand: 'R', layoutRow: null };
let undoStack = [];
const sheet = () => data.sheets.find(s => s.id === view.sheetId);
function pushUndo() {
  const s = sheet(); if (!s) return;
  undoStack.push(JSON.stringify(s));
  if (undoStack.length > 40) undoStack.shift();
}
function touch() { const s = sheet(); if (s) s.updated = Date.now(); persist(); }
function undo() {
  if (!undoStack.length) return;
  const prev = sanitizeSheet(JSON.parse(undoStack.pop()));
  const i = data.sheets.findIndex(s => s.id === view.sheetId);
  if (i >= 0) data.sheets[i] = prev;
  view.editor = null; view.layoutRow = null;
  persist(); render(); toast('Undone');
}

/* ================= Utilities ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
function fmtDate(ts) { try { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } }

/* Dialog: returns Promise<value of pressed button | input text> */
function dialog({ title, body = '', input = null, buttons }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay middle enter';
    ov.innerHTML = `<div class="panel center" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}
      ${input !== null ? `<div class="field"><input class="text-in" id="dlgInput" value="${esc(input)}" maxlength="80"></div>` : ''}
      <div class="dialog-buttons ${buttons.length > 2 ? 'stack' : ''}">
        ${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('#dlgInput');
    if (inp) { inp.focus(); inp.select(); }
    else ov.querySelector('.btn').focus();
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { const def = buttons[+b.dataset.i]; close(def.value === 'input' ? (inp.value.trim() || null) : def.value); }
      else if (e.target === ov) close(null);
    });
    ov.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && inp) { const d = buttons.find(b => b.value === 'input'); if (d) close(inp.value.trim() || null); }
    });
  });
}
const confirmDlg = (title, body, yes = 'Remove', cls = 'primary') =>
  dialog({ title, body, buttons: [{ label: 'Cancel', value: false }, { label: yes, value: true, cls }] });
const askName = (title, current, action = 'Save') =>
  dialog({ title, input: current, buttons: [{ label: 'Cancel', value: null }, { label: action, value: 'input', cls: 'primary' }] });

/* ================= Keyboard SVG ================= */
let svgSeq = 0;
const WW = 20, WH = 80, BW = 12, BH = 50;
function patternDef(id, st, bg) {
  const c = st.color;
  if (st.pattern === 'cross') return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${bg}"/><path d="M0 0L6 6M6 0L0 6" stroke="${c}" stroke-width="1.6"/></pattern>`;
  if (st.pattern === 'dots') return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${bg}"/><circle cx="3" cy="3" r="1.7" fill="${c}"/></pattern>`;
  return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${bg}"/><rect width="3" height="6" fill="${c}"/></pattern>`;
}
function markShape(m, x, white, st, acc, pid) {
  const w = white ? WW : BW, h = white ? WH : BH;
  if (st.type === 'key') return `<rect class="mark" x="${x}" y="0" width="${w}" height="${h}" fill="${st.color}" stroke="#1E2433" stroke-width="1" pointer-events="none"/>`;
  if (st.type === 'pattern') return `<rect class="mark" x="${x}" y="0" width="${w}" height="${h}" fill="url(#${pid})" stroke="#1E2433" stroke-width="1" pointer-events="none"/>`;
  const cx = x + w / 2;
  if (st.type === 'dot') {
    const r = white ? 7 : 5, cy = h - (white ? 13 : 10);
    return `<circle class="mark" cx="${cx}" cy="${cy}" r="${r}" fill="${st.color}" stroke="#1E2433" stroke-width="1" pointer-events="none"/>`;
  }
  const r = white ? 8.5 : 5.8, cy = h - (white ? 13 : 10);
  const tc = lum(st.color) < 0.35 ? '#FFFFFF' : '#1E2433';
  const label = notePc(m, acc);
  const fs = white ? (label.length > 1 ? 8.5 : 10) : (label.length > 1 ? 5.4 : 6.5);
  return `<g class="mark" pointer-events="none"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${st.color}" stroke="#1E2433" stroke-width="1"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-weight="700" font-size="${fs}" fill="${tc}">${esc(label)}</text></g>`;
}
function keyboardSVG(cell, n, styles, { interactive = false, pxPerKey = null } = {}) {
  const count = KEYS_PER_ROW[n];
  const s = cell.start;
  const whites = WHITES.slice(s, s + count);
  const id = 'k' + (++svgSeq);
  const W = count * WW + 1, H = WH + 9;
  const bg = { L: patternDef(id + 'L', styles.L, '#FFFFFF') + patternDef(id + 'Lb', styles.L, '#8A8A8A'),
               R: patternDef(id + 'R', styles.R, '#FFFFFF') + patternDef(id + 'Rb', styles.R, '#8A8A8A') };
  let wk = '', wm = '', bk = '', bm = '';
  whites.forEach((m, i) => {
    const x = 0.5 + i * WW;
    wk += `<rect ${interactive ? `data-midi="${m}" role="button" aria-label="${noteName(m, cell.acc)}"` : ''} x="${x}" y="0.5" width="${WW}" height="${WH}" fill="#FFFFFF" stroke="#1E2433" stroke-width="1"/>`;
    if (cell.marks[m]) wm += markShape(m, x, true, styles[cell.marks[m]], cell.acc, id + cell.marks[m]);
    if (m === MIDDLE_C) wk += `<path d="M${x + WW / 2 - 4} ${WH + 8.5} L${x + WW / 2} ${WH + 3} L${x + WW / 2 + 4} ${WH + 8.5} Z" fill="#7D1D2C"/>`;
  });
  whites.forEach((m, i) => {
    if (i === whites.length - 1) return;
    const b = m + 1;
    if (isWhite(b) || b > HIGH) return;
    const x = 0.5 + (i + 1) * WW - BW / 2;
    bk += `<rect ${interactive ? `data-midi="${b}" role="button" aria-label="${noteName(b, cell.acc)}"` : ''} x="${x}" y="0.5" width="${BW}" height="${BH}" fill="#8A8A8A" stroke="#1E2433" stroke-width="1" rx="1"/>`;
    if (cell.marks[b]) bm += markShape(b, x, false, styles[cell.marks[b]], cell.acc, id + cell.marks[b] + 'b');
  });
  const size = pxPerKey ? `width="${count * pxPerKey}" height="${Math.round(H * pxPerKey / WW)}"` : '';
  return `<svg viewBox="0 0 ${W} ${H}" ${size} preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="${interactive ? 'false' : 'true'}"><defs>${bg.L}${bg.R}</defs>${wk}${wm}${bk}${bm}</svg>`;
}

/* ================= Rendering ================= */
const app = document.getElementById('app');
function render() {
  if (view.screen === 'sheet' && sheet()) renderSheet();
  else { view.screen = 'home'; renderHome(); }
  renderEditor();
}

function miniLayout(rows) {
  return `<div class="mini-layout" aria-hidden="true">${rows.map(n => `<div class="mini-row" style="grid-template-columns:repeat(${n},1fr)">${'<div class="mini-cell"></div>'.repeat(n)}</div>`).join('')}</div>`;
}

function renderHome() {
  document.title = 'Chord Worksheet';
  const sheets = [...data.sheets].sort((a, b) => b.updated - a.updated);
  app.innerHTML = `
  <header class="bar"><h1>Chord Worksheet</h1></header>
  <main class="home">
    <p class="home-intro">Mark the keys for each chord, name it, and print the page. Leave keys or names blank to make an assignment.</p>
    <h2 class="section-title">Start a new sheet</h2>
    <div class="starters">
      ${STARTERS.map((s, i) => `<button class="starter" data-starter="${i}">${miniLayout(s.rows)}<strong>${esc(s.name)}</strong><span>${esc(s.desc)}</span></button>`).join('')}
    </div>
    <h2 class="section-title">Your sheets</h2>
    ${sheets.length ? `<ul class="sheet-list">${sheets.map(s => {
      const chords = s.pages.reduce((a, p) => a + p.rows.reduce((b, r) => b + r.cells.filter(cellHasContent).length, 0), 0);
      return `<li><button class="sheet-open" data-open="${s.id}"><strong>${esc(s.name)}</strong><span>${s.pages.length} page${s.pages.length > 1 ? 's' : ''}, ${chords} chord${chords === 1 ? '' : 's'} · ${fmtDate(s.updated)}</span></button>
        <button class="btn quiet" data-more="${s.id}" aria-label="More for ${esc(s.name)}">•••</button></li>`;
    }).join('')}</ul>` : `<div class="empty">No saved sheets yet. Pick a layout above to start one.</div>`}
    <h2 class="section-title">Backup</h2>
    <p class="home-intro">Sheets live on this device. Export a backup now and then, or to move sheets to another device.</p>
    <div class="backup-row">
      <button class="btn" data-act="export-all" ${data.sheets.length ? '' : 'disabled'}>Export all sheets</button>
      <button class="btn" data-act="import">Import sheets</button>
      <button class="btn" data-act="styles-default">Default hand colors</button>
    </div>
  </main>`;
}

function kbMax(r) { const t = Math.max(r, 4); return Math.floor((880 - 10 * (t - 1)) / t) - 44; }
function pageScale() {
  const w = Math.min(app.clientWidth - 28, 816);
  return Math.max(0.2, w / 816);
}

function cellHTML(cell, n, styles, pi, ri, ci, editable) {
  const out = outOfView(cell, n);
  const active = view.editor && view.editor.pi === pi && view.editor.ri === ri && view.editor.ci === ci;
  return `<div class="cell ${active ? 'active' : ''}" ${editable ? `data-cell="${pi},${ri},${ci}" role="button" tabindex="0" aria-label="Edit chord ${esc(cell.name || 'blank')}"` : ''}>
    <span class="cell-name"><span class="cell-name-text">${esc(cell.name)}</span></span>
    ${keyboardSVG(cell, n, styles)}
    ${out ? `<span class="flag">${out} note${out > 1 ? 's' : ''} out of view</span>` : ''}
  </div>`;
}

  <main>

            </div>
            <div class="rows" style="grid-template-rows:repeat(${Math.max(p.rows.length, 4)}, minmax(0, 1fr)); --kh:${kbMax(p.rows.length)}px">
              ${p.rows.map((r, ri) => `
              <div class="row" style="grid-template-columns:repeat(${r.n}, minmax(0,1fr))">

                ${view.layout ? `<div class="row-tools"></div>

                  </div>
                  <button class="btn" data-act="row-up" data-pi="${pi}" data-ri="${ri}" ${ri ? '' : 'disabled'} aria-label="Move row up">↑</button>
                  <button class="btn" data-act="row-down" data-pi="${pi}" data-ri="${ri}" ${ri < p.rows.length - 1 ? '' : 'disabled'} aria-label="Move row down">↓</button>
                  <button class="btn danger" data-act="row-del" data-pi="${pi}" data-ri="${ri}" ${p.rows.length > 1 ? '' : 'disabled'} aria-label="Delete row">✕</button>
                </div>` : ''}
              </div>`).join('')}
            </div>
            ${view.layout && p.rows.length < MAX_ROWS ? `<div class="add-row"><button class="btn" data-act="row-add" data-pi="${pi}">+ Add row</button></div>` : ''}
          </div>
        </div>
      </section>`).join('')}
    </div>
    <div class="after-pages no-print">

  document.body.classList.toggle('no-nameline', !s.print.nameLine);

/* ================= Chord editor ================= */
let editorEl = null;
function cellAt(e) { const s = sheet(); const r = s.pages[e.pi].rows[e.ri]; return { s, row: r, cell: r.cells[e.ci] }; }
function cellOrder() {
  const s = sheet(), out = [];
  s.pages.forEach((p, pi) => p.rows.forEach((r, ri) => r.cells.forEach((_, ci) => out.push({ pi, ri, ci }))));
  return out;
}
function orderIndex(e) { return cellOrder().findIndex(o => o.pi === e.pi && o.ri === e.ri && o.ci === e.ci); }

function renderEditor(keepScroll) {
  if (!view.editor || !sheet()) { if (editorEl) { editorEl.remove(); editorEl = null; } return; }
  const { s, row, cell } = cellAt(view.editor);
  const n = row.n, count = KEYS_PER_ROW[n];
  const oldScroller = editorEl && editorEl.querySelector('.kbd-scroll');
  const prevScroll = oldScroller ? oldScroller.scrollLeft : null;
  const hadFocusName = document.activeElement && document.activeElement.id === 'chordName';
  if (!editorEl) {
    editorEl = document.createElement('div');
    editorEl.className = 'overlay enter';
    document.body.appendChild(editorEl);
    setTimeout(() => editorEl && editorEl.classList.remove('enter'), 250);
    editorEl.addEventListener('click', onEditorClick);
    editorEl.addEventListener('input', onEditorInput);
    editorEl.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); });
  }
  const idx = orderIndex(view.editor), total = cellOrder().length;
  const out = outOfView(cell, n);
  const first = WHITES[cell.start], last = WHITES[cell.start + count - 1];
  const st = s.styles;
  editorEl.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Edit chord">
    <div class="panel-top">
      <button class="btn" data-e="prev" ${idx > 0 ? '' : 'disabled'} aria-label="Previous chord">‹</button>
      <h2 class="grow" style="margin:0">Chord ${idx + 1} of ${total}</h2>
      <button class="btn" data-e="next" ${idx < total - 1 ? '' : 'disabled'} aria-label="Next chord">›</button>
      <button class="btn primary" data-e="done">Done</button>
    </div>
    <div class="field"><label for="chordName">Chord name</label>
      <input id="chordName" class="text-in" value="${esc(cell.name)}" maxlength="40" placeholder="Leave blank for students to fill in" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="controls">
      <div><span class="lbl">Marking</span><div class="seg" role="group" aria-label="Hand">
        <button data-e="hand" data-v="L" aria-pressed="${view.hand === 'L'}"><span class="swatch-dot" style="background:${st.L.color}"></span>Left hand</button>
        <button data-e="hand" data-v="R" aria-pressed="${view.hand === 'R'}"><span class="swatch-dot" style="background:${st.R.color}"></span>Right hand</button>
      </div></div>
      <div><span class="lbl">Note names</span><div class="seg" role="group" aria-label="Sharps or flats">
        <button data-e="acc" data-v="sharp" aria-pressed="${cell.acc === 'sharp'}">♯</button>
        <button data-e="acc" data-v="flat" aria-pressed="${cell.acc === 'flat'}">♭</button>
      </div></div>
    </div>
    <div class="kbd-scroll"><div class="felt"></div>${keyboardSVG(cell, n, st, { interactive: true, pxPerKey: 42 })}</div>
    <div class="shift-row">
      <button class="btn" data-e="shift" data-v="-7" aria-label="Down an octave">«</button>
      <button class="btn" data-e="shift" data-v="-1" aria-label="Down one key">‹</button>
      <span class="range">${noteName(first, cell.acc)} to ${noteName(last, cell.acc)}</span>
      <button class="btn" data-e="shift" data-v="1" aria-label="Up one key">›</button>
      <button class="btn" data-e="shift" data-v="7" aria-label="Up an octave">»</button>
    </div>
    ${out ? `<div class="warn">${out} marked note${out > 1 ? 's are' : ' is'} outside this keyboard. Shift the range or clear the chord.${KEYS_PER_ROW[n] < 29 ? ' Fewer chords in this row gives a wider keyboard.' : ''}</div>` : ''}
    <div class="editor-actions">
      <button class="btn" data-e="clear-notes" ${Object.keys(cell.marks).length ? '' : 'disabled'}>Clear notes</button>
      <button class="btn" data-e="clear-all" ${cellHasContent(cell) ? '' : 'disabled'}>Clear chord</button>
      <span class="grow"></span>
      <button class="btn" data-e="copy-next" ${idx < total - 1 && cellHasContent(cell) ? '' : 'disabled'}>Copy to next</button>
    </div>
  </div>`;
  const sc = editorEl.querySelector('.kbd-scroll');
  if (keepScroll && prevScroll !== null) sc.scrollLeft = prevScroll;
  else centerScroll(sc, cell, n);
  if (hadFocusName) { const i = editorEl.querySelector('#chordName'); i.focus(); const v = i.value.length; i.setSelectionRange(v, v); }
}
function centerScroll(sc, cell, n) {
  const count = KEYS_PER_ROW[n];
  const ms = markedMidis(cell);
  let target = ms.length ? (needSpan(ms[0])[0] + needSpan(ms[ms.length - 1])[1]) / 2
    : (WIDX[MIDDLE_C] >= cell.start && WIDX[MIDDLE_C] < cell.start + count ? WIDX[MIDDLE_C] : cell.start + count / 2);
  const px = (target - cell.start + 0.5) * 42 + 10;
  sc.scrollLeft = Math.max(0, px - sc.clientWidth / 2);
}
function openEditor(pi, ri, ci) { view.editor = { pi, ri, ci }; renderSheet(); renderEditor(); }
function closeEditor() { view.editor = null; renderSheet(); renderEditor(); }
let nameUndoPushed = false;
function onEditorInput(e) {
  if (e.target.id !== 'chordName') return;
  if (!nameUndoPushed) { pushUndo(); nameUndoPushed = true; }
  const { cell } = cellAt(view.editor);
  cell.name = e.target.value;
  touch(); refreshActiveCell();
}
function refreshActiveCell() {
  const e = view.editor; if (!e) return;
  const el = app.querySelector(`[data-cell="${e.pi},${e.ri},${e.ci}"]`);
  if (!el) return;
  const { s, row, cell } = cellAt(e);
  const tmp = document.createElement('div');
  tmp.innerHTML = cellHTML(cell, row.n, s.styles, e.pi, e.ri, e.ci, true);
  el.replaceWith(tmp.firstElementChild);
  const u = app.querySelector('[data-act="undo"]'); if (u) u.disabled = !undoStack.length;
}
async function onEditorClick(ev) {
  if (ev.target === editorEl) { closeEditor(); return; }
  const key = ev.target.closest('[data-midi]');
  const { s, row, cell } = cellAt(view.editor);
  if (key) {
    const m = +key.dataset.midi;
    pushUndo(); nameUndoPushed = false;
    if (cell.marks[m] === view.hand) delete cell.marks[m];
    else cell.marks[m] = view.hand;
    touch(); refreshActiveCell(); renderEditor(true); return;
  }
  const b = ev.target.closest('[data-e]'); if (!b) return;
  const act = b.dataset.e;
  const order = cellOrder(), idx = orderIndex(view.editor);
  nameUndoPushed = false;
  if (act === 'done') closeEditor();
  else if (act === 'prev' || act === 'next') { view.editor = order[idx + (act === 'next' ? 1 : -1)]; renderSheet(); renderEditor(); scrollCellIntoView(); }
  else if (act === 'hand') { view.hand = b.dataset.v; renderEditor(true); }
  else if (act === 'acc') { pushUndo(); cell.acc = b.dataset.v; touch(); refreshActiveCell(); renderEditor(true); }
  else if (act === 'shift') {
    const count = KEYS_PER_ROW[row.n];
    const ns = clamp(cell.start + +b.dataset.v, 0, maxStart(count));
    if (ns !== cell.start) { pushUndo(); cell.start = ns; touch(); refreshActiveCell(); renderEditor(true); }
  }
  else if (act === 'clear-notes') { pushUndo(); cell.marks = {}; touch(); refreshActiveCell(); renderEditor(true); }
  else if (act === 'clear-all') { pushUndo(); Object.assign(cell, newCell(row.n)); touch(); refreshActiveCell(); renderEditor(); }
  else if (act === 'copy-next') {
    const nx = order[idx + 1];
    const target = cellAt(nx);
    if (cellHasContent(target.cell)) {
      const ok = await confirmDlg('Replace the next chord?', `The next chord${target.cell.name ? ' (' + target.cell.name + ')' : ''} already has content.`, 'Replace');
      if (!ok) return;
    }
    pushUndo();
    const copy = JSON.parse(JSON.stringify(cell));
    target.row.cells[nx.ci] = copy;
    if (target.row.n !== row.n) fitStart(copy, target.row.n);
    touch(); view.editor = nx; renderSheet(); renderEditor(); scrollCellIntoView();
    toast('Copied. Now adjust it.');
  }
}
function scrollCellIntoView() {
  const e = view.editor; if (!e) return;
  const el = app.querySelector(`[data-cell="${e.pi},${e.ri},${e.ci}"]`);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* ================= Layout editing ================= */
async function setRowN(pi, ri, n) {
  const s = sheet(); const row = s.pages[pi].rows[ri];
  if (row.n === n) return;
  const dropped = row.cells.slice(n).filter(cellHasContent);
  if (dropped.length) {
    const names = dropped.map(c => c.name || 'unnamed chord').join(', ');
    const ok = await confirmDlg(`Remove ${dropped.length} chord${dropped.length > 1 ? 's' : ''}?`, `This row will only fit ${n}. Removing: ${names}. You can undo this.`);
    if (!ok) return;
  }
  pushUndo();
  const kept = row.cells.slice(0, n);
  kept.forEach(c => fitStart(c, n));
  while (kept.length < n) kept.push(newCell(n));
  row.n = n; row.cells = kept;
  touch(); renderSheet();
  const flagged = kept.filter(c => outOfView(c, n)).length;
  if (flagged) toast(`${flagged} chord${flagged > 1 ? 's' : ''} no longer fit. Look for the yellow tag.`);
}
async function deleteRow(pi, ri) {
  const s = sheet(); const row = s.pages[pi].rows[ri];
  const filled = row.cells.filter(cellHasContent).length;
  if (filled && !(await confirmDlg('Delete this row?', `It has ${filled} chord${filled > 1 ? 's' : ''}. You can undo this.`, 'Delete row'))) return;
  pushUndo(); s.pages[pi].rows.splice(ri, 1); touch(); renderSheet();
}
function moveRow(pi, ri, d) {
  const rows = sheet().pages[pi].rows; const j = ri + d;
  if (j < 0 || j >= rows.length) return;
  pushUndo(); [rows[ri], rows[j]] = [rows[j], rows[ri]]; touch(); renderSheet();
}
function addRow(pi) {
  const rows = sheet().pages[pi].rows;
  if (rows.length >= MAX_ROWS) return;
  pushUndo(); rows.push(newRow(rows.length ? rows[rows.length - 1].n : 2)); touch(); renderSheet();
}
function addPage() {
  const s = sheet(); const last = s.pages[s.pages.length - 1];
  pushUndo(); s.pages.push(newPage(last.rows.map(r => r.n))); touch(); renderSheet();
  const pages = app.querySelectorAll('.page-wrap');
  pages[pages.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
  toast('Page added with the same layout');
}
function dupPage(pi) {
  const s = sheet(); pushUndo();
  s.pages.splice(pi + 1, 0, JSON.parse(JSON.stringify(s.pages[pi]))); touch(); renderSheet();
  toast('Page duplicated');
}
async function delPage(pi) {
  const s = sheet(); if (s.pages.length < 2) return;
  const filled = s.pages[pi].rows.reduce((a, r) => a + r.cells.filter(cellHasContent).length, 0);
  if (filled && !(await confirmDlg(`Delete page ${pi + 1}?`, `It has ${filled} chord${filled > 1 ? 's' : ''}. You can undo this.`, 'Delete page'))) return;
  pushUndo(); s.pages.splice(pi, 1); touch(); renderSheet();
}

/* ================= Hand styles ================= */
function openStyles(target) {
  // target: 'sheet' or 'default'
  const base = target === 'sheet' ? sheet().styles : data.settings.styles;
  const work = cloneStyles(base);
  let makeDefault = false;
  const ov = document.createElement('div');
  ov.className = 'overlay enter';
  document.body.appendChild(ov);
  setTimeout(() => ov.classList.remove('enter'), 250);
  const demo = { name: '', acc: 'sharp', start: WIDX[48], marks: { 48: 'L', 55: 'L', 64: 'R', 67: 'R', 70: 'R', 72: 'R' } };
  function draw() {
    const risk = grayRisk(work);
    ov.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Hand colors">
      <div class="panel-top"><h2 class="grow" style="margin:0">${target === 'sheet' ? 'Hand colors for this sheet' : 'Default hand colors'}</h2>
        <button class="btn" data-s="cancel">Cancel</button><button class="btn primary" data-s="save">Save</button></div>
      ${target === 'default' ? '<p>New sheets start with these. Existing sheets keep their own.</p>' : ''}
      ${['L', 'R'].map(h => {
        const st = work[h];
        return `<div class="hand-style"><h3>${h === 'L' ? 'Left hand' : 'Right hand'}</h3>
          <div class="seg" role="group" aria-label="Mark style">${STYLE_TYPES.map(([v, l]) => `<button data-s="type" data-h="${h}" data-v="${v}" aria-pressed="${st.type === v}">${l}</button>`).join('')}</div>
          ${st.type === 'pattern' ? `<div class="seg" role="group" aria-label="Pattern" style="margin-top:8px">${PATTERNS.map(([v, l]) => `<button data-s="pattern" data-h="${h}" data-v="${v}" aria-pressed="${st.pattern === v}">${l}</button>`).join('')}</div>` : ''}
          <div class="swatches">${PRESETS.map(c => `<button data-s="color" data-h="${h}" data-v="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${st.color.toLowerCase() === c.toLowerCase()}"></button>`).join('')}
            <input type="color" data-s="custom" data-h="${h}" value="${st.color}" aria-label="Custom color"></div>
        </div>`;
      }).join('')}
      ${risk ? '<div class="warn">These two may look alike on a black-and-white printer. Pick one dark and one light color, or use different styles.</div>' : ''}
      <div class="style-preview">${keyboardSVG(demo, 2, work)}</div>
      ${target === 'sheet' ? `<label class="check"><input type="checkbox" data-s="default" ${makeDefault ? 'checked' : ''}> Use for new sheets too</label>` : ''}
    </div>`;
  }
  draw();
  ov.addEventListener('click', e => {
    if (e.target === ov) { ov.remove(); return; }
    const b = e.target.closest('[data-s]'); if (!b) return;
    const a = b.dataset.s, h = b.dataset.h;
    if (a === 'cancel') { ov.remove(); return; }
    if (a === 'save') {
      if (target === 'sheet') {
        pushUndo(); sheet().styles = cloneStyles(work);
        if (makeDefault) data.settings.styles = cloneStyles(work);
        touch(); ov.remove(); render();
      } else { data.settings.styles = cloneStyles(work); persist(); ov.remove(); toast('Saved default hand colors'); }
      return;
    }
    if (a === 'default') { makeDefault = b.checked; return; }
    if (a === 'custom') return;
    if (a === 'type') work[h].type = b.dataset.v;
    if (a === 'pattern') work[h].pattern = b.dataset.v;
    if (a === 'color') work[h].color = b.dataset.v;
    draw();
  });
  ov.addEventListener('change', e => {
    if (e.target.dataset.s === 'custom') { work[e.target.dataset.h].color = e.target.value; draw(); }
  });
}

/* ================= Print ================= */
async function openPrint() {
  const s = sheet();
  const ov = document.createElement('div');
  ov.className = 'overlay middle';
  ov.innerHTML = `<div class="panel center" role="dialog" aria-modal="true" aria-label="Print">
    <h2>Print</h2>
    <p>Turn things off to print a student copy. Leave everything on for your answer key.</p>
    <label class="check"><input type="checkbox" id="pNames" ${s.print.names ? 'checked' : ''}> Chord names</label>
    <label class="check"><input type="checkbox" id="pMarks" ${s.print.marks ? 'checked' : ''}> Marked notes</label>
    <label class="check"><input type="checkbox" id="pLine" ${s.print.nameLine ? 'checked' : ''}> Student name and date lines</label>
    <div class="dialog-buttons"><button class="btn" data-p="cancel">Cancel</button><button class="btn primary" data-p="go">Print</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    if (e.target === ov) { ov.remove(); return; }
    const b = e.target.closest('[data-p]'); if (!b) return;
    if (b.dataset.p === 'cancel') { ov.remove(); return; }
    s.print = { names: ov.querySelector('#pNames').checked, marks: ov.querySelector('#pMarks').checked, nameLine: ov.querySelector('#pLine').checked };
    persist(); ov.remove();
    if (view.editor) { view.editor = null; renderEditor(); }
    renderSheet();
    document.body.classList.toggle('hide-names', !s.print.names);
    document.body.classList.toggle('hide-marks', !s.print.marks);
    document.body.classList.toggle('no-nameline', !s.print.nameLine);
    setTimeout(() => {
      try { window.print(); }
      catch (err) { toast('Printing isn’t available here. Open the app in Safari to print.'); }
    }, 60);
  });
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('hide-names', 'hide-marks');
  const s = sheet(); document.body.classList.toggle('no-nameline', !!(s && !s.print.nameLine));
});

/* ================= Export / import ================= */
async function saveFile(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  try {
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename, data: text }); return; }
        catch (e) { if (e && e.code === 'declined') return; }
      }
    }
  } catch (e) { /* fall through */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const safeName = n => n.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || 'sheet';
function exportAll() {
  saveFile(`chord-worksheets-${stamp()}.json`, JSON.stringify({ app: 'chord-worksheet', version: 1, settings: data.settings, sheets: data.sheets }, null, 1));
}
function exportOne(s) {
  saveFile(`${safeName(s.name)}.json`, JSON.stringify({ app: 'chord-worksheet', version: 1, sheets: [s] }, null, 1));
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.app !== 'chord-worksheet' || !Array.isArray(d.sheets)) throw new Error('bad');
    let added = 0, replaced = 0;
    for (const raw of d.sheets) {
      const s = sanitizeSheet(raw);
      const i = data.sheets.findIndex(x => x.id === s.id);
      if (i >= 0) {
        if (JSON.stringify(data.sheets[i]) === JSON.stringify(s)) continue;
        const choice = await dialog({ title: `“${s.name}” is already here`, body: 'Replace your copy with the imported one, or keep both?',
          buttons: [{ label: 'Keep both', value: 'both' }, { label: 'Replace mine', value: 'replace', cls: 'primary' }, { label: 'Skip', value: 'skip' }] });
        if (choice === 'replace') { data.sheets[i] = s; replaced++; }
        else if (choice === 'both') { s.id = uid(); s.name += ' (imported)'; data.sheets.push(s); added++; }
      } else { data.sheets.push(s); added++; }
    }
    persist(); render();
    toast(added || replaced ? `Imported ${added + replaced} sheet${added + replaced > 1 ? 's' : ''}` : 'Nothing new to import');
  } catch (err) {
    toast('That file isn’t a Chord Worksheet backup.');
  }
});

/* ================= Sheet management ================= */
async function createSheet(starter) {
  const name = await askName('Name this sheet', starter.name === 'Two hands' ? 'Two-hand voicings' : 'New chord sheet', 'Create');
  if (!name) return;
  const s = sanitizeSheet({ id: uid(), name, updated: Date.now(), styles: cloneStyles(data.settings.styles), pages: [newPage(starter.rows)] });
  data.sheets.push(s); persist();
  openSheet(s.id);
}
function openSheet(id) {
  view.screen = 'sheet'; view.sheetId = id; view.layout = false; view.editor = null; undoStack = [];
  window.scrollTo(0, 0); render();
}
async function sheetMenu(id) {
  const s = data.sheets.find(x => x.id === id); if (!s) return;
  const a = await dialog({ title: s.name, buttons: [
    { label: 'Open', value: 'open', cls: 'primary' }, { label: 'Rename', value: 'rename' },
    { label: 'Duplicate', value: 'dup' }, { label: 'Export', value: 'export' },
    { label: 'Delete', value: 'delete', cls: 'danger' }, { label: 'Cancel', value: null }] });
  if (a === 'open') openSheet(id);
  if (a === 'rename') { const n = await askName('Rename sheet', s.name); if (n) { s.name = n; s.updated = Date.now(); persist(); render(); } }
  if (a === 'dup') {
    const n = await askName('Name the copy', s.name + ' copy', 'Duplicate');
    if (n) { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.name = n; c.updated = Date.now(); data.sheets.push(c); persist(); render(); toast('Sheet duplicated'); }
  }
  if (a === 'export') exportOne(s);
  if (a === 'delete') {
    if (await confirmDlg(`Delete “${s.name}”?`, 'This can’t be undone. Export it first if you might want it back.', 'Delete')) {
      data.sheets = data.sheets.filter(x => x.id !== id); persist(); render(); toast('Sheet deleted');
    }
  }
}

/* ================= Events ================= */
app.addEventListener('click', async e => {
  const st = e.target.closest('[data-starter]');
  if (st) return createSheet(STARTERS[+st.dataset.starter]);
  const op = e.target.closest('[data-open]'); if (op) return openSheet(op.dataset.open);
  const mo = e.target.closest('[data-more]'); if (mo) return sheetMenu(mo.dataset.more);
  const c = e.target.closest('[data-cell]');
  if (c && !view.layout) { const [pi, ri, ci] = c.dataset.cell.split(',').map(Number); return openEditor(pi, ri, ci); }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, pi = +b.dataset.pi, ri = +b.dataset.ri;
  switch (act) {
    case 'home': view.screen = 'home'; view.editor = null; render(); window.scrollTo(0, 0); break;
    case 'rename': { const s = sheet(); const n = await askName('Rename sheet', s.name); if (n) { s.name = n; touch(); renderSheet(); } break; }
    case 'undo': undo(); break;
    case 'layout': view.layout = !view.layout; view.editor = null; render(); break;
    case 'styles': openStyles('sheet'); break;
    case 'styles-default': openStyles('default'); break;
    case 'print': openPrint(); break;
    case 'row-n': setRowN(pi, ri, +b.dataset.n); break;
    case 'row-up': moveRow(pi, ri, -1); break;
    case 'row-down': moveRow(pi, ri, 1); break;
    case 'row-del': deleteRow(pi, ri); break;
    case 'row-add': addRow(pi); break;
    case 'add-page': addPage(); break;
    case 'dup-page': dupPage(pi); break;
    case 'del-page': delPage(pi); break;
    case 'export-all': exportAll(); break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-cell]')) {
    e.preventDefault(); const [pi, ri, ci] = e.target.dataset.cell.split(',').map(Number); openEditor(pi, ri, ci);
  }
});
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (view.screen === 'sheet') renderSheet(); }, 120);
});

/* ================= Boot ================= */
load();
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
})();
</script>
