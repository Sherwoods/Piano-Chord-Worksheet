<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* =========================================================
   UI style guide: "reading room"
   Paper-inspired, light only, no texture. The UI is the desk
   and the stationery around the worksheet; the worksheet page
   (.paper and everything inside it) keeps its own fixed styles.
   ========================================================= */
:root {
  /* Ink and stock */
  --ink: #23262E;          /* primary text, strong rules */
  --ink-soft: #4A4D55;     /* secondary text */
  --muted: #76716A;        /* captions, meta */
  --rule: #D6D0C4;         /* hairlines */
  --rule-strong: #B9B1A3;  /* control borders */
  --desk: #E9E5DD;         /* page background: pressboard */
  --stock: #F8F6F1;        /* panels, cards, controls */
  --stock-raised: #FCFBF8; /* inputs, active surfaces */
  --felt: #7D1D2C;         /* the one accent: piano felt */
  --felt-deep: #641622;
  --felt-wash: #F2E7E5;
  --warn: #7A5410;
  --warn-wash: #F6EBD2;

  /* Type */
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  /* Worksheet type: fixed, not part of the UI style guide */
  --sheet-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sheet-display: "Young Serif", Georgia, "Times New Roman", serif;

  /* Spacing scale (4px base) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --radius: 3px;
  --lift: 0 1px 1px rgba(60, 50, 35, .06), 0 2px 6px rgba(60, 50, 35, .06);
  --lift-high: 0 2px 4px rgba(60, 50, 35, .08), 0 12px 32px rgba(60, 50, 35, .14);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; background: var(--desk); }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
::selection { background: var(--felt-wash); }

/* ---------- Controls ---------- */
.btn {
  font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: .01em;
  border: 1px solid var(--rule-strong); background: var(--stock); color: var(--ink);
  border-radius: var(--radius); padding: 7px 14px; min-height: 40px;
  box-shadow: 0 1px 0 rgba(60, 50, 35, .06);
  transition: background-color .12s, border-color .12s;
}
.btn:hover { background: var(--stock-raised); border-color: var(--ink-soft); }
.btn:active { background: var(--desk); box-shadow: none; }
.btn.primary { background: var(--felt); border-color: var(--felt-deep); color: #FBF7F4; }
.btn.primary:hover { background: var(--felt-deep); }
.btn.on { background: var(--felt-wash); border-color: var(--felt); color: var(--felt-deep); }
.btn.quiet { background: transparent; border-color: transparent; box-shadow: none; }
.btn.quiet:hover { background: var(--stock); border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { background: var(--stock); border-color: var(--rule-strong); }
.btn.danger { color: var(--felt); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; background: var(--stock); }
.seg button { font-family: var(--sans); font-size: 15px; border: 0; background: transparent; padding: 7px 13px; min-height: 38px; min-width: 40px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button:hover { background: var(--stock-raised); }
.seg button[aria-pressed="true"] { background: var(--felt-wash); color: var(--felt-deep); box-shadow: inset 0 -2px 0 var(--felt); }

/* ---------- App bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s3) var(--s4); background: var(--desk);
  border-bottom: 3px double var(--rule-strong);
}
.bar h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -.005em; margin: 0; flex: 1; min-width: 0; }
.bar .title-btn { flex: 1; min-width: 0; text-align: left; background: none; border: 0; border-bottom: 1px dotted transparent; padding: 4px 2px; font-family: var(--serif); font-weight: 600; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title-btn:hover { border-bottom-color: var(--rule-strong); }
main { padding: var(--s5) var(--s4) 96px; max-width: 880px; margin: 0 auto; }

/* ---------- Home ---------- */
.home-intro { color: var(--ink-soft); margin: 0 0 var(--s5); max-width: 58ch; font-size: 17px; }
.section-title { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: var(--s6) 0 var(--s3); padding-bottom: var(--s2); border-bottom: 1px solid var(--rule); }
.starters { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: var(--s3); }
.starter { display: flex; flex-direction: column; text-align: left; background: var(--stock); border: 1px solid var(--rule); border-radius: var(--radius); padding: var(--s3); box-shadow: var(--lift); transition: border-color .12s, transform .12s; }
.starter:hover { border-color: var(--rule-strong); }
.starter strong { display: block; font-weight: 600; margin-bottom: 2px; }
.starter span { color: var(--muted); font-size: 15px; font-style: italic; }
.mini-layout { display: grid; gap: 3px; margin-bottom: var(--s3); background: #fff; border: 1px solid var(--rule); padding: 6px; border-radius: 1px; aspect-ratio: 8.5/7; align-content: start; }
.mini-row { display: grid; gap: 3px; }
.mini-cell { height: 12px; background: repeating-linear-gradient(90deg, #fff 0 5px, #9aa1ad 5px 6px); border: 1px solid #9aa1ad; }
.sheet-list { list-style: none; margin: 0; padding: 0; background: var(--stock); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--lift); }
.sheet-list li { display: flex; align-items: center; border-bottom: 1px solid var(--rule); padding-right: var(--s2); }
.sheet-list li:last-child { border-bottom: 0; }
.sheet-open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: var(--s3) var(--s4); }
.sheet-open:hover strong { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.sheet-open strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-open span { color: var(--muted); font-size: 15px; font-family: var(--sans); }
.empty { color: var(--ink-soft); font-style: italic; padding: var(--s4); background: var(--stock); border: 1px dashed var(--rule-strong); border-radius: var(--radius); }
.backup-row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* =========================================================
   Worksheet page: fixed styles, independent of the UI guide
   ========================================================= */
.pages { display: flex; flex-direction: column; gap: var(--s6); align-items: center; }
.page-wrap { width: 100%; max-width: 816px; }
.page-head { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s2); color: var(--muted); font-family: var(--sans); font-size: 14px; flex-wrap: wrap; }
.page-head .spacer { flex: 1; }
.paper-frame { position: relative; width: 100%; overflow: hidden; }
.paper {
  width: 816px; height: 1056px; padding: 48px; background: #fff; color: #1E2433;
  transform-origin: top left; box-shadow: 0 1px 2px rgba(40,34,24,.16), 0 8px 24px rgba(40,34,24,.12);
  display: flex; flex-direction: column; font-family: var(--sheet-ui); font-size: 16px; line-height: 1.4;
}
.paper-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 10px; border-bottom: 2px solid #1E2433; margin-bottom: 18px; }
.paper-title { font-family: var(--sheet-display); font-size: 30px; line-height: 1; margin: 0; min-width: 120px; outline: none; border-bottom: 2px dashed transparent; }
.paper-title[contenteditable]:hover, .paper-title[contenteditable]:focus { border-bottom-color: #EBD9D6; }
.paper-title[contenteditable]:empty::before { content: 'Tap to add a title'; color: #B9B1A3; }
@media print { .paper-title[contenteditable]:empty::before { content: none; } }
.cell[data-pos] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cell.dragging { opacity: .35; }
.cell.drop-target { outline: 3px dashed #7D1D2C !important; outline-offset: 5px; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; opacity: .9; background: #fff; box-shadow: 0 8px 24px rgba(40,34,24,.25); transform-origin: top left; }
.fingers { display: flex; align-items: center; gap: 6px; margin-top: var(--s2); flex-wrap: wrap; }
.name-line { display: flex; gap: 18px; font-size: 13px; color: #1E2433; }
.name-line span { display: inline-block; border-bottom: 1px solid #1E2433; min-width: 150px; padding-top: 14px; }
.name-line span.date { min-width: 90px; }
.rows { flex: 1; min-height: 0; display: grid; gap: 10px; }
.row { display: grid; column-gap: 29px; align-items: center; position: relative; }
.cell { position: relative; min-width: 0; border-radius: 6px; }
.cell-name { display: block; border-bottom: 1px solid #7A8190; max-width: 240px; height: 30px; font-size: 19px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
.cell svg { display: block; width: 100%; height: auto; max-height: var(--kh, 999px); }
.paper.editable .cell { cursor: pointer; }
.paper.editable .cell:hover { outline: 2px solid #EBD9D6; outline-offset: 5px; }
.cell.active { outline: 3px solid #7D1D2C !important; outline-offset: 5px; }
.flag { position: absolute; top: 2px; right: 0; font-family: var(--sans); font-size: 12px; background: #FFF3D6; color: #8A5A00; border: 1px solid #E8C877; border-radius: 10px; padding: 1px 8px; }
.row-tools { position: absolute; left: -48px; right: -48px; top: -6px; bottom: -6px; border: 2px dashed #B9B1A3; border-radius: 4px; pointer-events: none; }
.layout-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 20px; }
.paper .layout-bar .seg button { min-width: 64px; min-height: 52px; font-size: 22px; }
.paper .layout-bar .btn { min-height: 52px; font-size: 20px; }
.layout-row-controls { position: absolute; z-index: 3; top: 50%; right: 0; transform: translateY(-50%); background: var(--stock); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px; box-shadow: var(--lift-high); }
.add-row { margin-top: 8px; }
.add-row .btn { font-size: 22px; min-height: 56px; width: 100%; border-style: dashed; background: var(--stock); }

.after-pages { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s5); flex-wrap: wrap; }

/* ---------- Panels and dialogs ---------- */
.overlay { position: fixed; inset: 0; background: rgba(35, 30, 22, .28); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.panel {
  background: var(--stock); width: 100%; max-width: 900px;
  border: 1px solid var(--rule-strong); border-bottom: 0; border-radius: 4px 4px 0 0;
  padding: var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom, 0px)); max-height: 92%; overflow-y: auto;
  box-shadow: var(--lift-high);
}
.panel.center { border-radius: 4px; border-bottom: 1px solid var(--rule-strong); margin: auto var(--s3); max-width: 460px; padding: var(--s5); }
.overlay.middle { align-items: center; }
.panel h2 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0 0 var(--s3); }
.panel p { margin: 0 0 var(--s4); color: var(--ink-soft); }
.panel-top { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); padding-bottom: var(--s3); border-bottom: 1px solid var(--rule); }
.panel-top .grow { flex: 1; }
.field { display: flex; flex-direction: column; gap: var(--s1); margin-bottom: var(--s4); }
.field label, .lbl { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-soft); }
.text-in { border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 9px 12px; background: var(--stock-raised); min-height: 44px; width: 100%; font-family: var(--serif); font-size: 18px; box-shadow: inset 0 1px 2px rgba(60,50,35,.06); }
.text-in:focus { border-color: var(--ink-soft); outline: none; box-shadow: inset 0 1px 2px rgba(60,50,35,.06), 0 0 0 2px var(--felt-wash); }
.text-in::placeholder { color: var(--muted); font-style: italic; }
.controls { display: flex; gap: var(--s3) var(--s5); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--s4); }
.controls > div { display: flex; flex-direction: column; gap: var(--s1); }
.swatch-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.3); }
.kbd-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: #fff; padding: 0 10px 10px; }
.kbd-scroll .felt { height: 5px; background: #7D1D2C; margin: 0 -10px 0; }
.kbd-scroll svg { display: block; height: auto; }
.kbd-scroll svg [data-midi] { cursor: pointer; }
.shift-row { display: flex; align-items: center; gap: var(--s2); margin: var(--s3) 0 var(--s4); flex-wrap: wrap; }
.shift-row .range { flex: 1; text-align: center; color: var(--ink-soft); font-style: italic; font-size: 16px; min-width: 120px; }
.editor-actions { display: flex; gap: var(--s2); flex-wrap: wrap; padding-top: var(--s3); border-top: 1px solid var(--rule); }
.editor-actions .grow { flex: 1; }
.dialog-buttons { display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--s4); }
.dialog-buttons.stack { flex-direction: column; align-items: stretch; }
.check { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--rule); }
.check:last-of-type { border-bottom: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--felt); }
.hint { font-size: 14px; color: var(--muted); margin-top: var(--s3); }

/* Chord builder */
.builder { border: 1px solid var(--rule); background: var(--stock-raised); border-radius: var(--radius); padding: var(--s2) var(--s3) var(--s3); margin-bottom: var(--s4); }
.builder > summary { cursor: pointer; font-family: var(--serif); font-weight: 600; padding: var(--s1) 0; }
.builder > summary .sym { font-family: var(--sans); font-weight: 500; color: var(--felt-deep); margin-left: var(--s2); }
.b-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: var(--s3); }
.b-row > .lbl { flex-basis: 100%; }
.chip { font-family: var(--sans); font-size: 15px; border: 1px solid var(--rule-strong); background: var(--stock); border-radius: var(--radius); padding: 6px 10px; min-height: 38px; min-width: 40px; }
.chip:hover { background: var(--stock-raised); }
.chip[aria-pressed="true"] { background: var(--felt-wash); color: var(--felt-deep); border-color: var(--felt); box-shadow: inset 0 -2px 0 var(--felt); }
.chip[aria-disabled="true"], .seg button[aria-disabled="true"] { opacity: .45; }
.b-preview { margin-top: var(--s3); padding: var(--s2) var(--s3); background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); font-family: var(--sans); font-size: 15px; overflow-wrap: anywhere; }
.b-preview strong { font-size: 18px; font-weight: 600; }
.b-actions { display: flex; justify-content: flex-end; margin-top: var(--s2); }
#parseHint { margin-top: var(--s2); }
#parseHint:empty { display: none; }
.warn { background: var(--warn-wash); color: var(--warn); border-left: 3px solid #C9A04A; border-radius: 0 var(--radius) var(--radius) 0; padding: var(--s2) var(--s3); font-size: 15px; margin: var(--s2) 0 var(--s3); }

/* Hand color editor */
.hand-style { border: 1px solid var(--rule); background: var(--stock-raised); border-radius: var(--radius); padding: var(--s4); margin-bottom: var(--s3); }
.hand-style h3 { margin: 0 0 var(--s3); font-size: 17px; font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s3) 0 0; align-items: center; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--stock-raised); padding: 0; box-shadow: 0 0 0 1px var(--rule-strong); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.swatches input[type="color"] { width: 40px; height: 34px; border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 2px; background: var(--stock); }
.style-preview { background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); padding: var(--s2); margin-top: var(--s2); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--stock); font-family: var(--sans); padding: 10px 16px; border-radius: var(--radius); z-index: 80; max-width: 90%; font-size: 15px; box-shadow: var(--lift-high); }

@media (prefers-reduced-motion: no-preference) {
  .overlay.enter .panel { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- Print ---------- */
.print-only { display: none; }
/* Print geometry is fixed: the page has no browser margin and the sheet carries its own 0.5in margin,
   so the printout matches the on-screen page no matter which browser or margin setting is used. */
@page { size: 8.5in 11in; margin: 0; }
@media print {
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { padding: 0 !important; }
  .bar, .page-head, .after-pages, .overlay, .toast, .flag, .layout-row-controls, .add-row, .row-tools, .no-print, .home { display: none !important; }
  main { padding: 0 !important; max-width: none !important; margin: 0 !important; }
  .pages { display: block !important; }
  .page-wrap { max-width: none !important; width: auto !important; }
  .paper-frame { height: auto !important; overflow: visible !important; }
  .paper { transform: none !important; box-shadow: none !important; width: 816px !important; height: 1054px !important; padding: 48px !important; margin: 0 !important; overflow: hidden !important; break-after: page; page-break-after: always; break-inside: avoid; }
  .page-wrap:last-child .paper { break-after: auto; page-break-after: auto; }
  .cell, .cell.active, .paper.editable .cell:hover { outline: none !important; }
  body.hide-names .cell-name-text { visibility: hidden; }
  body.hide-marks .mark { display: none; }
  body.no-nameline .name-line { visibility: hidden; }
}
</style>

<div id="app"></div>

<script src="chords.js?v=9"></script>
<script>
(() => {
'use strict';

/* ================= Music helpers ================= */
const LOW = 21, HIGH = 108;                         // A0..C8
const WHITE_PCS = new Set([0, 2, 4, 5, 7, 9, 11]);
const isWhite = m => WHITE_PCS.has(((m % 12) + 12) % 12);
const WHITES = [];
for (let m = LOW; m <= HIGH; m++) if (isWhite(m)) WHITES.push(m);
const WIDX = {}; WHITES.forEach((m, i) => { WIDX[m] = i; });
const KEYS_PER_ROW = { 1: 29, 2: 15, 3: 9 };        // white keys visible per chord, by chords-per-row
const DEFAULT_START = { 1: WIDX[36], 2: WIDX[48], 3: WIDX[60] }; // C2, C3, C4 → middle C centered-ish
const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const noteName = (m, acc) => (acc === 'flat' ? FLAT : SHARP)[m % 12] + (Math.floor(m / 12) - 1);
const notePc = (m, acc) => (acc === 'flat' ? FLAT : SHARP)[m % 12];
const MIDDLE_C = 60;
const MAX_ROWS = 6;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function maxStart(n) { return WHITES.length - n; }

// white-index span a marked key needs to be fully visible
function needSpan(m) {
  if (isWhite(m)) return [WIDX[m], WIDX[m]];
  return [WIDX[m - 1], WIDX[m + 1]];
}
function markedMidis(cell) { return Object.keys(cell.marks).map(Number).sort((a, b) => a - b); }
function outOfView(cell, n) {
  const count = KEYS_PER_ROW[n], s = cell.start, e = s + count - 1;
  return markedMidis(cell).filter(m => { const [a, b] = needSpan(m); return a < s || b > e; }).length;
}
function fitStart(cell, n) {
  const count = KEYS_PER_ROW[n];
  const ms = markedMidis(cell);
  if (!ms.length) { cell.start = DEFAULT_START[n]; return; }
  let lo = Infinity, hi = -Infinity;
  ms.forEach(m => { const [a, b] = needSpan(m); lo = Math.min(lo, a); hi = Math.max(hi, b); });
  let s;
  if (hi - lo + 1 <= count) {
    s = Math.round((lo + hi) / 2 - (count - 1) / 2);
    s = clamp(s, hi - count + 1, lo);
  } else s = lo;
  cell.start = clamp(s, 0, maxStart(count));
}

/* ================= Styles ================= */
const PRESETS = ['#1F3A93', '#7D1D2C', '#2E6B3A', '#4B2C6F', '#222222', '#F2A541', '#8FC3E8', '#F4A3B4', '#B7E07A', '#BDBDBD'];
const DEFAULT_STYLES = {
  L: { type: 'key', color: '#1F3A93', pattern: 'stripes', names: false },
  R: { type: 'key', color: '#F2A541', pattern: 'stripes', names: false }
};
const STYLE_TYPES = [['key', 'Color'], ['pattern', 'Pattern'], ['dot', 'Dot']];
const PATTERNS = [['stripes', 'Stripes'], ['cross', 'Crosshatch'], ['dots', 'Polka dots']];
function hexToRgb(h) { const x = parseInt(h.slice(1), 16); return [(x >> 16) & 255, (x >> 8) & 255, x & 255]; }
function lum(h) {
  const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function grayRisk(styles) {
  const a = styles.L, b = styles.R;
  if (a.type !== b.type) return false;
  if (a.type === 'pattern' && a.pattern !== b.pattern) return false;
  return Math.abs(lum(a.color) - lum(b.color)) < 0.2;
}
const cloneStyles = s => JSON.parse(JSON.stringify(s));

/* ================= Data ================= */
const STORE_KEY = 'chordWorksheet.v1';
let data = { version: 1, settings: { styles: cloneStyles(DEFAULT_STYLES) }, sheets: [] };
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.sheets)) data = sanitizeData(d); }
  } catch (e) { storageOk = false; }
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); storageOk = true; }
  catch (e) { if (storageOk) toast('This device won’t save right now. Export a backup to keep your work.'); storageOk = false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function newCell(n) { return { chord: null, label: '', acc: 'sharp', start: DEFAULT_START[n], marks: {}, fingers: {} }; }
function newRow(n) { return { n, cells: Array.from({ length: n }, () => newCell(n)) }; }
function newPage(ns) { return { rows: ns.map(newRow) }; }
function cellHasContent(c) { return !!(c.chord || c.label.trim() || Object.keys(c.marks).length || Object.keys(c.fingers || {}).length); }
// Printed chord name: the built chord's symbol, otherwise the free-text label.
function cellTitle(c) { const s = sheet(); return c.chord ? ChordLib.render(c.chord, s ? s.notation : 'standard') : c.label; }

function sanitizeStyle(s, fallback) {
  const out = Object.assign({}, fallback);
  if (s && typeof s === 'object') {
    if (STYLE_TYPES.some(t => t[0] === s.type)) out.type = s.type;
    if (s.type === 'label') { out.type = 'dot'; out.names = true; }
    if (typeof s.names === 'boolean') out.names = s.names;
    if (typeof s.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(s.color)) out.color = s.color;
    if (PATTERNS.some(p => p[0] === s.pattern)) out.pattern = s.pattern;
  }
  return out;
}
function sanitizeStyles(s) { s = s || {}; return { L: sanitizeStyle(s.L, DEFAULT_STYLES.L), R: sanitizeStyle(s.R, DEFAULT_STYLES.R) }; }
function sanitizeCell(c, n) {
  const out = newCell(n);
  if (!c || typeof c !== 'object') return out;
  // Older saves only have a free-text name; it becomes the label.
  const label = typeof c.label === 'string' ? c.label : typeof c.name === 'string' ? c.name : '';
  out.label = label.slice(0, 40);
  out.chord = ChordLib.sanitize(c.chord);
  if (c.acc === 'flat') out.acc = 'flat';
  if (c.marks && typeof c.marks === 'object') {
    for (const k in c.marks) { const m = +k; if (m >= LOW && m <= HIGH && (c.marks[k] === 'L' || c.marks[k] === 'R')) out.marks[m] = c.marks[k]; }
  }
  if (c.fingers && typeof c.fingers === 'object') {
    for (const k in c.fingers) { const m = +k, v = c.fingers[k]; if (m >= LOW && m <= HIGH && [1, 2, 3, 4, 5].includes(v)) out.fingers[m] = v; }
  }
  if (Number.isInteger(c.start)) out.start = clamp(c.start, 0, maxStart(KEYS_PER_ROW[n]));
  return out;
}
function sanitizeSheet(s) {
  const pages = (Array.isArray(s.pages) ? s.pages : []).map(p => {
    const rows = (Array.isArray(p && p.rows) ? p.rows : []).slice(0, MAX_ROWS).map(r => {
      const n = [1, 2, 3].includes(r && r.n) ? r.n : 2;
      const cells = Array.from({ length: n }, (_, i) => sanitizeCell(r.cells && r.cells[i], n));
      return { n, cells };
    });
    return { rows: rows.length ? rows : [newRow(2)] };
  });
  return {
    id: typeof s.id === 'string' ? s.id : uid(),
    name: typeof s.name === 'string' && s.name.trim() ? s.name.slice(0, 80) : 'Untitled sheet',
    title: typeof s.title === 'string' ? s.title.slice(0, 80) : 'Chord Worksheet',
    updated: Number.isFinite(s.updated) ? s.updated : Date.now(),
    styles: sanitizeStyles(s.styles),
    notation: s.notation === 'jazz' ? 'jazz' : 'standard',
    spelling: s.spelling === 'strict' ? 'strict' : 'plain',
    print: { names: !(s.print && s.print.names === false), marks: !(s.print && s.print.marks === false), nameLine: !(s.print && s.print.nameLine === false) },
    pages: pages.length ? pages : [newPage([2, 2, 2, 2])]
  };
}
function sanitizeData(d) {
  return { version: 1, settings: { styles: sanitizeStyles(d.settings && d.settings.styles) }, sheets: d.sheets.map(sanitizeSheet) };
}

const STARTERS = [
  { name: '8 chords', desc: '4 rows of 2', rows: [2, 2, 2, 2] },
  { name: 'Two hands', desc: '4 rows of 1', rows: [1, 1, 1, 1] },
  { name: '15 chords', desc: '5 rows of 3', rows: [3, 3, 3, 3, 3] },

/* ================= View state ================= */
const view = { screen: 'home', sheetId: null, layout: false, editor: null, hand: 'R', layoutRow: null, tap: 'mark', finger: 1, builderOpen: true };
let undoStack = [];
const sheet = () => data.sheets.find(s => s.id === view.sheetId);
function pushUndo() {
  const s = sheet(); if (!s) return;
  undoStack.push(JSON.stringify(s));
  if (undoStack.length > 40) undoStack.shift();
}
function touch() { const s = sheet(); if (s) s.updated = Date.now(); persist(); }
function undo() {
  if (!undoStack.length) return;
  const prev = sanitizeSheet(JSON.parse(undoStack.pop()));
  const i = data.sheets.findIndex(s => s.id === view.sheetId);
  if (i >= 0) data.sheets[i] = prev;

}

/* ================= Utilities ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
function fmtDate(ts) { try { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } }

/* Dialog: returns Promise<value of pressed button | input text> */
function dialog({ title, body = '', input = null, buttons }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay middle enter';
    ov.innerHTML = `<div class="panel center" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}
      ${input !== null ? `<div class="field"><input class="text-in" id="dlgInput" value="${esc(input)}" maxlength="80"></div>` : ''}
      <div class="dialog-buttons ${buttons.length > 2 ? 'stack' : ''}">
        ${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('#dlgInput');
    if (inp) { inp.focus(); inp.select(); }
    else ov.querySelector('.btn').focus();
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { const def = buttons[+b.dataset.i]; close(def.value === 'input' ? (inp.value.trim() || null) : def.value); }
      else if (e.target === ov) close(null);
    });
    ov.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && inp) { const d = buttons.find(b => b.value === 'input'); if (d) close(inp.value.trim() || null); }
    });
  });
}
const confirmDlg = (title, body, yes = 'Remove', cls = 'primary') =>
  dialog({ title, body, buttons: [{ label: 'Cancel', value: false }, { label: yes, value: true, cls }] });
const askName = (title, current, action = 'Save') =>
  dialog({ title, input: current, buttons: [{ label: 'Cancel', value: null }, { label: action, value: 'input', cls: 'primary' }] });

/* ================= Keyboard SVG ================= */
let svgSeq = 0;
const WW = 20, WH = 80, BW = 12, BH = 50;
function patternDef(id, st, bg) {
  const c = st.color;
  if (st.pattern === 'cross') return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${bg}"/><path d="M0 0L6 6M6 0L0 6" stroke="${c}" stroke-width="1.6"/></pattern>`;
  if (st.pattern === 'dots') return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${bg}"/><circle cx="3" cy="3" r="1.7" fill="${c}"/></pattern>`;
  return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${bg}"/><rect width="3" height="6" fill="${c}"/></pattern>`;
}
function markShape(m, x, white, st, label, pid) {
  const w = white ? WW : BW, h = white ? WH : BH;
  const cx = x + w / 2, cy = h - (white ? 13 : 10), r = 8.5;
  let out = '';
  if (st.type === 'key') out = `<rect x="${x}" y="0" width="${w}" height="${h}" fill="${st.color}" stroke="#1E2433" stroke-width="1"/>`;
  else if (st.type === 'pattern') out = `<rect x="${x}" y="0" width="${w}" height="${h}" fill="url(#${pid})" stroke="#1E2433" stroke-width="1"/>`;
  else if (!st.names) out = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${st.color}" stroke="#1E2433" stroke-width="1"/>`;
  if (st.names) {
    // Named dot sits on top of the key fill; on a filled key it is white so the letter stays readable.
    const fill = st.type === 'dot' ? st.color : '#FFFFFF';
    const tc = lum(fill) < 0.35 ? '#FFFFFF' : '#1E2433';
    // Letter stays full size; a sharp/flat sign is drawn smaller beside it.
    const acc2 = label.length > 1 ? `<tspan font-size="7">${esc(label.slice(1))}</tspan>` : '';
    out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="#1E2433" stroke-width="1"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-weight="700" font-size="10" fill="${tc}">${esc(label[0])}${acc2}</text>`;
  }
  return `<g class="mark" pointer-events="none">${out}</g>`;
}
// Pitch class → note name from the cell's chord spelling (chord tones and bass only).
function chordKeyNames(cell) {
  if (!cell.chord) return null;
  const s = sheet();
  const sp = ChordLib.spell(cell.chord, s ? s.spelling : 'plain');
  const map = {};
  sp.notes.forEach(n => { if (!(n.pc in map)) map[n.pc] = n.name; });
  if (sp.bass && !(sp.bass.pc in map)) map[sp.bass.pc] = sp.bass.name;
  return map;
}
function keyboardSVG(cell, n, styles, { interactive = false, pxPerKey = null } = {}) {
  const count = KEYS_PER_ROW[n];
  const s = cell.start;
  const whites = WHITES.slice(s, s + count);
  const id = 'k' + (++svgSeq);
  const W = count * WW + 1, H = WH + 24;
  const fingers = cell.fingers || {};
  const kn = chordKeyNames(cell);
  const lab = m => (kn && kn[m % 12]) || notePc(m, cell.acc);
  let fk = '';
  const finger = (m, cx) => { if (fingers[m]) fk += `<text class="mark" x="${cx}" y="${WH + 19}" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-weight="700" font-size="11" fill="#1E2433" pointer-events="none">${fingers[m]}</text>`; };
  const bg = { L: patternDef(id + 'L', styles.L, '#FFFFFF') + patternDef(id + 'Lb', styles.L, '#8A8A8A'),
               R: patternDef(id + 'R', styles.R, '#FFFFFF') + patternDef(id + 'Rb', styles.R, '#8A8A8A') };
  let wk = '', wm = '', bk = '', bm = '';
  whites.forEach((m, i) => {
    const x = 0.5 + i * WW;
    wk += `<rect ${interactive ? `data-midi="${m}" role="button" aria-label="${noteName(m, cell.acc)}"` : ''} x="${x}" y="0.5" width="${WW}" height="${WH}" fill="#FFFFFF" stroke="#1E2433" stroke-width="1"/>`;
    finger(m, x + WW / 2);
    if (cell.marks[m]) wm += markShape(m, x, true, styles[cell.marks[m]], lab(m), id + cell.marks[m]);
    if (m === MIDDLE_C) wk += `<path d="M${x + WW / 2 - 4} ${WH + 8.5} L${x + WW / 2} ${WH + 3} L${x + WW / 2 + 4} ${WH + 8.5} Z" fill="#7D1D2C"/>`;
  });
  whites.forEach((m, i) => {
    if (i === whites.length - 1) return;
    const b = m + 1;
    if (isWhite(b) || b > HIGH) return;
    const x = 0.5 + (i + 1) * WW - BW / 2;
    bk += `<rect ${interactive ? `data-midi="${b}" role="button" aria-label="${noteName(b, cell.acc)}"` : ''} x="${x}" y="0.5" width="${BW}" height="${BH}" fill="#8A8A8A" stroke="#1E2433" stroke-width="1" rx="1"/>`;
    finger(b, x + BW / 2);
    if (cell.marks[b]) bm += markShape(b, x, false, styles[cell.marks[b]], lab(b), id + cell.marks[b] + 'b');
  });
  const size = pxPerKey ? `width="${count * pxPerKey}" height="${Math.round(H * pxPerKey / WW)}"` : '';
  return `<svg viewBox="0 0 ${W} ${H}" ${size} preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="${interactive ? 'false' : 'true'}"><defs>${bg.L}${bg.R}</defs>${wk}${wm}${bk}${bm}${fk}</svg>`;
}

/* ================= Chord editor ================= */
let editorEl = null;
function cellAt(e) { const s = sheet(); const r = s.pages[e.pi].rows[e.ri]; return { s, row: r, cell: r.cells[e.ci] }; }
function cellOrder() {
  const s = sheet(), out = [];
  s.pages.forEach((p, pi) => p.rows.forEach((r, ri) => r.cells.forEach((_, ci) => out.push({ pi, ri, ci }))));
  return out;
}
function orderIndex(e) { return cellOrder().findIndex(o => o.pi === e.pi && o.ri === e.ri && o.ci === e.ci); }

function renderEditor(keepScroll) {
  if (!view.editor || !sheet()) { if (editorEl) { editorEl.remove(); editorEl = null; } return; }
  const { s, row, cell } = cellAt(view.editor);
  const n = row.n, count = KEYS_PER_ROW[n];

const B_LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

}

  const c = cell.chord, s = sheet();
  const row = (label, body) => `<div class="b-row"><span class="lbl">${label}</span>${body}</div>`;
  const chips = (group, items) => items.map(([v, t]) => chip(cell, group, v, t)).join('');
  const seg = (group, label) => `<div class="seg" role="group" aria-label="${label}">${B_ACC.map(([v, t]) => chip(cell, group, v, t, '')).join('')}</div>`;
  let preview = 'No chord yet. Tap a root note to start.';
  if (c) {
    const sp = ChordLib.spell(c, s.spelling);
    preview = `<strong>${esc(ChordLib.render(c, s.notation))}</strong> · ${sp.notes.map(n => esc(n.name)).join(' ')}${sp.bass ? ` · bass ${esc(sp.bass.name)}` : ''}`;

    <summary>Chord builder${c ? `<span class="sym">${esc(ChordLib.render(c, s.notation))}</span>` : ''}</summary>
    ${row('Root', chips('root', B_LETTERS.map(l => [l, l])) + seg('rootAcc', 'Root accidental'))}
    ${row('Quality', chips('quality', [['maj', 'maj'], ['min', 'min'], ['dim', 'dim'], ['aug', 'aug'], ['sus2', 'sus2'], ['sus4', 'sus4'], ['5', '5']]))}
    ${row('Seventh', chips('seventh', [[null, 'none'], ['6', '6'], ['7', '7'], ['maj7', 'maj7'], ['dim7', 'dim7']]))}
    ${row('Extension', chips('ext', [[9, '9'], [11, '11'], [13, '13']]))}
    ${row('Alterations', chips('alt', [['b5', '♭5'], ['s5', '♯5'], ['b9', '♭9'], ['s9', '♯9'], ['s11', '♯11'], ['b13', '♭13'], ['alt7', 'alt']]))}

/* ================= Layout editing ================= */
async function setRowN(pi, ri, n) {

  if (dropped.length) {
    const names = dropped.map(c => cellTitle(c) || 'unnamed chord').join(', ');
    const ok = await confirmDlg(`Remove ${dropped.length} chord${dropped.length > 1 ? 's' : ''}?`, `This row will only fit ${n}. Removing: ${names}. You can undo this.`);
    if (!ok) return;
  }
  pushUndo();
  const kept = row.cells.slice(0, n);

  while (kept.length < n) kept.push(newCell(n));
  row.n = n; row.cells = kept;
  touch(); renderSheet();

}

/* ================= Transpose ================= */
const INTERVALS = ['', 'minor 2nd', 'major 2nd', 'minor 3rd', 'major 3rd', 'perfect 4th', 'tritone', 'perfect 5th', 'minor 6th', 'major 6th', 'minor 7th', 'major 7th'];
function sheetCells(s) { return s.pages.flatMap(p => p.rows.flatMap(r => r.cells.map(cell => ({ cell, n: r.n })))); }
// One letter shift for the whole sheet, chosen from every chord root and bass, so the chords stay in one key.
function transposePlan(s, semis) {
  const notes = [];
  sheetCells(s).forEach(({ cell }) => {
    if (cell.chord) { notes.push(cell.chord.root); if (cell.chord.bass) notes.push(cell.chord.bass); }
    else (ChordLib.labelNotes(cell.label) || []).forEach(p => notes.push(p.note));
  });
  return ChordLib.letterShift(notes, semis);
}
// Marked keys move by the same amount; a cell that would run off the piano moves an octave the other way.
function transposeMarks(cell, n, semis) {
  const ms = Object.keys(cell.marks).map(Number);
  const fits = d => ms.every(m => m + d >= LOW && m + d <= HIGH);
  const d = fits(semis) ? semis : fits(semis - Math.sign(semis) * 12) ? semis - Math.sign(semis) * 12 : semis;
  const marks = {}, fingers = {};
  ms.forEach(m => { if (m + d >= LOW && m + d <= HIGH) marks[m + d] = cell.marks[m]; });
  Object.keys(cell.fingers || {}).forEach(k => { const m = +k + d; if (marks[m]) fingers[m] = cell.fingers[k]; });
  cell.marks = marks; cell.fingers = fingers;
  if (ms.length) fitStart(cell, n);
}
function transposeSheet(s, semis) {
  const steps = transposePlan(s, semis);
  let skipped = 0;
  sheetCells(s).forEach(({ cell, n }) => {
    if (cell.chord) cell.chord = ChordLib.transposeChord(cell.chord, semis, steps);
    else if (cell.label.trim()) {
      const t = ChordLib.transposeLabel(cell.label, semis, steps);
      if (t !== null) cell.label = t.slice(0, 40);
      else if (/^\s*[A-Ga-g]/.test(cell.label)) skipped++;
    }
    transposeMarks(cell, n, semis);
  });
  return skipped;
}
function openTranspose() {
  const s = sheet();
  let semis = 0;
  const ov = document.createElement('div');
  ov.className = 'overlay middle enter';
  const names = sheetCells(s).map(({ cell }) => cellTitle(cell)).filter(t => t && t.trim()).slice(0, 8);
  function draw() {
    let preview = 'Pick how far to move the chords.';
    if (semis) {
      const copy = sanitizeSheet(JSON.parse(JSON.stringify(s)));
      transposeSheet(copy, semis);
      const after = sheetCells(copy).map(({ cell }) => cell.chord ? ChordLib.render(cell.chord, copy.notation) : cell.label).filter(t => t && t.trim()).slice(0, 8);
      preview = names.length ? `${names.map(esc).join(' · ')}<br>→ <strong>${after.map(esc).join(' · ')}</strong>` : 'No chord names on this sheet yet. Marked keys will move.';
    }
    const a = Math.abs(semis);
    const amount = semis ? `${semis > 0 ? 'Up' : 'Down'} a ${INTERVALS[a]} · ${a} half step${a > 1 ? 's' : ''}` : 'No change';
    ov.innerHTML = `<div class="panel center" role="dialog" aria-modal="true" aria-label="Transpose sheet">
      <h2>Transpose sheet</h2>
      <p>Moves every chord on every page, and the marked keys with them.</p>
      <div class="shift-row">
        <button class="btn" data-t="step" data-v="-1" ${semis > -11 ? '' : 'disabled'} aria-label="Down a half step">−</button>
        <span class="range" aria-live="polite">${amount}</span>
        <button class="btn" data-t="step" data-v="1" ${semis < 11 ? '' : 'disabled'} aria-label="Up a half step">+</button>
      </div>
      <div class="b-preview">${preview}</div>
      <div class="dialog-buttons"><button class="btn" data-t="cancel">Cancel</button><button class="btn primary" data-t="go" ${semis ? '' : 'disabled'}>Transpose</button></div>
    </div>`;
  }
  draw();
  document.body.appendChild(ov);
  setTimeout(() => ov.classList.remove('enter'), 250);
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') ov.remove(); });
  ov.addEventListener('click', e => {
    if (e.target === ov) { ov.remove(); return; }
    const b = e.target.closest('[data-t]'); if (!b || b.disabled) return;
    if (b.dataset.t === 'cancel') { ov.remove(); return; }
    if (b.dataset.t === 'step') { semis = clamp(semis + +b.dataset.v, -11, 11); draw(); return; }
    pushUndo();
    const skipped = transposeSheet(s, semis);
    touch(); ov.remove(); renderSheet();
    toast(`Transposed ${semis > 0 ? 'up' : 'down'} a ${INTERVALS[Math.abs(semis)]}.` +
      (skipped ? ` ${skipped} label${skipped > 1 ? 's' : ''} didn’t read as chords and stayed the same.` : ' Undo puts it back.'));
  });
}

/* ================= Print ================= */
async function openPrint() {
  const s = sheet();
  const ov = document.createElement('div');
  ov.className = 'overlay middle';
  ov.innerHTML = `<div class="panel center" role="dialog" aria-modal="true" aria-label="Print">
    <h2>Print</h2>
    <p>Turn things off to print a student copy. Leave everything on for your answer key.</p>
    <label class="check"><input type="checkbox" id="pNames" ${s.print.names ? 'checked' : ''}> Chord names</label>
    <label class="check"><input type="checkbox" id="pMarks" ${s.print.marks ? 'checked' : ''}> Marked notes</label>
    <label class="check"><input type="checkbox" id="pLine" ${s.print.nameLine ? 'checked' : ''}> Student name and date lines</label>
    <p class="hint">For the same result every time, set Scale to 100% (not “Fit to page”) and turn off Headers and footers in the print window.</p>
    <div class="dialog-buttons"><button class="btn" data-p="cancel">Cancel</button><button class="btn primary" data-p="go">Print</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    if (e.target === ov) { ov.remove(); return; }
    const b = e.target.closest('[data-p]'); if (!b) return;
    if (b.dataset.p === 'cancel') { ov.remove(); return; }
    s.print = { names: ov.querySelector('#pNames').checked, marks: ov.querySelector('#pMarks').checked, nameLine: ov.querySelector('#pLine').checked };
    persist(); ov.remove();
    if (view.editor) { view.editor = null; renderEditor(); }
    renderSheet();
    document.body.classList.toggle('hide-names', !s.print.names);
    document.body.classList.toggle('hide-marks', !s.print.marks);
    document.body.classList.toggle('no-nameline', !s.print.nameLine);
    const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => setTimeout(() => {
      try { window.print(); }
      catch (err) { toast('Printing isn’t available here. Open the app in Safari to print.'); }
    }, 60));
  });
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('hide-names', 'hide-marks');
  const s = sheet(); document.body.classList.toggle('no-nameline', !!(s && !s.print.nameLine));
});

/* ================= Export / import ================= */
async function saveFile(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  try {
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename, data: text }); return; }
        catch (e) { if (e && e.code === 'declined') return; }
      }
    }
  } catch (e) { /* fall through */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const safeName = n => n.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || 'sheet';
function exportAll() {
  saveFile(`chord-worksheets-${stamp()}.json`, JSON.stringify({ app: 'chord-worksheet', version: 1, settings: data.settings, sheets: data.sheets }, null, 1));
}
function exportOne(s) {
  saveFile(`${safeName(s.name)}.json`, JSON.stringify({ app: 'chord-worksheet', version: 1, sheets: [s] }, null, 1));
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.app !== 'chord-worksheet' || !Array.isArray(d.sheets)) throw new Error('bad');
    let added = 0, replaced = 0;
    for (const raw of d.sheets) {
      const s = sanitizeSheet(raw);
      const i = data.sheets.findIndex(x => x.id === s.id);
      if (i >= 0) {
        if (JSON.stringify(data.sheets[i]) === JSON.stringify(s)) continue;
        const choice = await dialog({ title: `“${s.name}” is already here`, body: 'Replace your copy with the imported one, or keep both?',
          buttons: [{ label: 'Keep both', value: 'both' }, { label: 'Replace mine', value: 'replace', cls: 'primary' }, { label: 'Skip', value: 'skip' }] });
        if (choice === 'replace') { data.sheets[i] = s; replaced++; }
        else if (choice === 'both') { s.id = uid(); s.name += ' (imported)'; data.sheets.push(s); added++; }
      } else { data.sheets.push(s); added++; }
    }
    persist(); render();
    toast(added || replaced ? `Imported ${added + replaced} sheet${added + replaced > 1 ? 's' : ''}` : 'Nothing new to import');
  } catch (err) {
    toast('That file isn’t a Chord Worksheet backup.');
  }
});

/* ================= Sheet management ================= */
async function createSheet(starter) {
  const name = await askName('Name this sheet', starter.name === 'Two hands' ? 'Two-hand voicings' : 'New chord sheet', 'Create');
  if (!name) return;
  const s = sanitizeSheet({ id: uid(), name, updated: Date.now(), styles: cloneStyles(data.settings.styles), pages: [newPage(starter.rows)] });
  data.sheets.push(s); persist();
  openSheet(s.id);
}
function openSheet(id) {
  view.screen = 'sheet'; view.sheetId = id; view.layout = false; view.editor = null; undoStack = [];
  window.scrollTo(0, 0); render();
}
async function sheetMenu(id) {
  const s = data.sheets.find(x => x.id === id); if (!s) return;
  const a = await dialog({ title: s.name, buttons: [
    { label: 'Open', value: 'open', cls: 'primary' }, { label: 'Rename', value: 'rename' },
    { label: 'Duplicate', value: 'dup' }, { label: 'Export', value: 'export' },
    { label: 'Delete', value: 'delete', cls: 'danger' }, { label: 'Cancel', value: null }] });
  if (a === 'open') openSheet(id);
  if (a === 'rename') { const n = await askName('Rename sheet', s.name); if (n) { s.name = n; s.updated = Date.now(); persist(); render(); } }
  if (a === 'dup') {
    const n = await askName('Name the copy', s.name + ' copy', 'Duplicate');
    if (n) { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.name = n; c.updated = Date.now(); data.sheets.push(c); persist(); render(); toast('Sheet duplicated'); }
  }
  if (a === 'export') exportOne(s);
  if (a === 'delete') {
    if (await confirmDlg(`Delete “${s.name}”?`, 'This can’t be undone. Export it first if you might want it back.', 'Delete')) {
      data.sheets = data.sheets.filter(x => x.id !== id); persist(); render(); toast('Sheet deleted');
    }
  }
}

/* ================= Events ================= */
app.addEventListener('click', async e => {
  if (suppressClick) { e.preventDefault(); return; }
  const st = e.target.closest('[data-starter]');
  if (st) return createSheet(STARTERS[+st.dataset.starter]);
  const op = e.target.closest('[data-open]'); if (op) return openSheet(op.dataset.open);
  const mo = e.target.closest('[data-more]'); if (mo) return sheetMenu(mo.dataset.more);
  const c = e.target.closest('[data-cell]');
  if (c && !view.layout) { const [pi, ri, ci] = c.dataset.cell.split(',').map(Number); return openEditor(pi, ri, ci); }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, pi = +b.dataset.pi, ri = +b.dataset.ri;
  switch (act) {
    case 'home': view.screen = 'home'; view.editor = null; render(); window.scrollTo(0, 0); break;
    case 'rename': { const s = sheet(); const n = await askName('Rename sheet', s.name); if (n) { s.name = n; touch(); renderSheet(); } break; }
    case 'undo': undo(); break;
    case 'layout': view.layout = !view.layout; view.editor = null; render(); break;
    case 'styles': openStyles('sheet'); break;
    case 'sheet-settings': openSheetSettings(); break;
    case 'transpose': openTranspose(); break;
    case 'styles-default': openStyles('default'); break;
    case 'print': openPrint(); break;
    case 'row-n': setRowN(pi, ri, +b.dataset.n); break;
    case 'row-up': moveRow(pi, ri, -1); break;
    case 'row-down': moveRow(pi, ri, 1); break;
    case 'row-del': deleteRow(pi, ri); break;
    case 'row-add': addRow(pi); break;
    case 'add-page': addPage(); break;
    case 'dup-page': dupPage(pi); break;
    case 'del-page': delPage(pi); break;
    case 'export-all': exportAll(); break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-cell]')) {
    e.preventDefault(); const [pi, ri, ci] = e.target.dataset.cell.split(',').map(Number); openEditor(pi, ri, ci);
  }
});
/* ================= Title editing ================= */
let titleUndoPushed = false;
app.addEventListener('input', e => {
  if (!e.target.matches('.paper-title')) return;
  const s = sheet(); if (!s) return;
  if (!titleUndoPushed) { pushUndo(); titleUndoPushed = true; }
  s.title = e.target.textContent.slice(0, 80);
  app.querySelectorAll('.paper-title').forEach(h => { if (h !== e.target) h.textContent = s.title; });
  touch();
  const u = app.querySelector('[data-act="undo"]'); if (u) u.disabled = !undoStack.length;
});
app.addEventListener('keydown', e => { if (e.target.matches('.paper-title') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
app.addEventListener('focusout', e => {
  if (!e.target.matches('.paper-title')) return;
  titleUndoPushed = false;
  if (!e.target.textContent.trim()) e.target.textContent = '';
});
app.addEventListener('paste', e => {
  if (!e.target.closest('.paper-title')) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' '));
});

/* ================= Drag to rearrange chords ================= */
// Mouse: drag after moving a few pixels. Touch: press and hold, then drag.
let drag = null, suppressClick = false;
function dragStart(el, x, y, touch) {
  drag = { el, from: el.dataset.pos.split(',').map(Number), x, y, on: false, touch, target: null, ghost: null };
  if (touch) drag.timer = setTimeout(() => dragBegin(drag ? drag.x : x, drag ? drag.y : y), 350);
}
function dragBegin(x, y) {
  if (!drag || drag.on) return;
  drag.on = true;
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true);
  g.classList.add('drag-ghost'); g.classList.remove('active');
  g.style.width = drag.el.offsetWidth + 'px';
  g.style.transform = `scale(${r.width / drag.el.offsetWidth})`;
  drag.dx = x - r.left; drag.dy = y - r.top;
  document.body.appendChild(g); drag.ghost = g;
  drag.el.classList.add('dragging');
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  dragMove(x, y);
}
function dragMove(x, y) {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(x - drag.x, y - drag.y) < 8) return;
    if (drag.touch) { dragCancel(); return; } // finger moved before the hold: let the page scroll
    dragBegin(x, y); return;
  }
  drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
  const over = document.elementFromPoint(x, y);
  const t = over && over.closest('[data-pos]');
  if (drag.target && drag.target !== t) drag.target.classList.remove('drop-target');
  drag.target = t && t !== drag.el ? t : null;
  if (drag.target) drag.target.classList.add('drop-target');
  if (y < 60) window.scrollBy(0, -12); else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
}
function dragCancel() {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.ghost) drag.ghost.remove();
  drag.el.classList.remove('dragging');
  if (drag.target) drag.target.classList.remove('drop-target');
  drag = null;
}
function dragEnd() {
  if (!drag) return;
  const d = drag;
  if (d.on) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 400); }
  const to = d.on && d.target ? d.target.dataset.pos.split(',').map(Number) : null;
  dragCancel();
  if (to) moveChord(d.from, to);
}
// Dropping on a chord puts the dragged chord in that spot; the chords between shift over by one.
function moveChord(from, to) {
  const s = sheet();
  const slots = [], cells = [];
  s.pages.forEach((p, pi) => p.rows.forEach((r, ri) => r.cells.forEach((c, ci) => { slots.push([pi, ri, ci]); cells.push(c); })));
  const key = a => a.join(',');
  const i = slots.findIndex(a => key(a) === key(from)), j = slots.findIndex(a => key(a) === key(to));
  if (i < 0 || j < 0 || i === j) return;
  pushUndo();
  const [c] = cells.splice(i, 1); cells.splice(j, 0, c);
  slots.forEach(([pi, ri, ci], k) => { const row = s.pages[pi].rows[ri]; row.cells[ci] = cells[k]; fitStart(cells[k], row.n); });
  view.editor = null;
  touch(); renderSheet(); renderEditor();
  toast('Chord moved. Undo puts it back.');
}
app.addEventListener('mousedown', e => {
  if (e.button !== 0 || view.screen !== 'sheet') return;
  const c = e.target.closest('[data-pos]'); if (c) dragStart(c, e.clientX, e.clientY, false);
});
window.addEventListener('mousemove', e => { if (drag && !drag.touch) { dragMove(e.clientX, e.clientY); if (drag && drag.on) e.preventDefault(); } });
window.addEventListener('mouseup', () => { if (drag && !drag.touch) dragEnd(); });
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || view.screen !== 'sheet') { dragCancel(); return; }
  const c = e.target.closest('[data-pos]'); if (c) dragStart(c, e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!drag || !drag.touch) return;
  if (drag.on) e.preventDefault();
  dragMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
window.addEventListener('touchend', e => { if (drag && drag.touch) { if (drag.on) e.preventDefault(); dragEnd(); } }, { passive: false });
window.addEventListener('touchcancel', dragCancel);
app.addEventListener('contextmenu', e => { if (drag && drag.on) e.preventDefault(); });

// The page scale depends only on width. Height changes come from the on-screen keyboard opening
// while the title is being typed, and re-rendering then would replace the title and drop focus.
let resizeTimer, lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (window.innerWidth === lastWidth) return;
    if (document.activeElement && document.activeElement.matches('.paper-title')) return;
    lastWidth = window.innerWidth;
    if (view.screen === 'sheet') renderSheet();
  }, 120);
});

/* ================= Boot ================= */
load();
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
})();
</script>
